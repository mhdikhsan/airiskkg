[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airiskkg"
version = "0.1.0"
description = "Python project for AI risk knowledge graph research."
requires-python = ">=3.11"
license = { text = "CC-BY-4.0" }
dependencies = [
    "rdflib",
    "pyshacl",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flask",
]
web = [
    "flask",
]

[project.scripts]
airiskkg = "airiskkg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"airiskkg.webapp" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

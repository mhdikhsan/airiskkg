[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airiskkg"
version = "0.1.0"
description = "Python project for AI risk knowledge graph research."
requires-python = ">=3.11"
license = { text = "CC-BY-4.0" }
dependencies = [
    "rdflib",
    "pyshacl",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flask",
    "websockets",
]
web = [
    "flask",
]

[project.scripts]
airiskkg = "airiskkg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"airiskkg.webapp" = ["static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "browser: drives a real headless browser (Chrome or Edge) over the DevTools protocol",
    "ui: exercises the workbench UI rather than the assessment pipeline",
]
# The browser suites are 70% of the wall clock and need a browser installed.
# Run them with `pytest -m browser`; `pytest -m ""` runs everything.
addopts = "-m 'not browser'"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airiskkg"
version = "0.1.0"
description = "Python project for AI risk knowledge graph research."
requires-python = ">=3.11"
license = { text = "CC-BY-4.0" }
dependencies = [
    "rdflib",
    "pyshacl",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flask",
]
web = [
    "flask",
]

[project.scripts]
airiskkg = "airiskkg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Spelled out because the front end is a tree - app.js plus core/, lib/ and
# panels/ - rather than relying on how the build backend happens to expand a
# bare "static/*". A wheel missing one of those serves a page whose imports 404.
"airiskkg.webapp" = ["static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
